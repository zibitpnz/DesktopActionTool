[project]
name = "desktopactiontool"
version = "0.2.0"
description = "Windows desktop automation CLI with screenshots, UI Automation and guarded input."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
uia = [
    "uiautomation==2.0.29",
    "comtypes==1.4.16",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
